name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      # ZIP nur bei Push auf main oder manuellem Start, nicht bei Pull Requests
      - name: ZIP erstellen
        if: github.event_name != 'pull_request'
        run: |
          cd dist
          zip -r ../rote-mappe-build.zip .

      - name: Artifact hochladen
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: rote-mappe-build
          path: rote-mappe-build.zip
          retention-days: 1
